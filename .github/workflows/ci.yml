name: Delivery CI (Backend & Frontend)

# Cuándo se ejecuta este pipeline
on:
  push:
    branches: [ "master", "develop" ]
  pull_request:
    branches: [ "master", "develop" ]

jobs:
  build-and-test:
    name: Backend - Build & Test
    runs-on: ubuntu-latest
    
    # Nos movemos a la carpeta del backend
    defaults:
      run:
        working-directory: ./delivery-backend

    # Configuramos MongoDB en la máquina virtual de GitHub
    services:
      mongodb:
        image: mongo:latest
        ports:
          - 27017:27017

    steps:
    - name: 📥 Clonar repositorio
      uses: actions/checkout@v4

    - name: ⚙️ Configurar Node.js 20
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: ./delivery-backend/package-lock.json

    - name: 📦 Instalar dependencias
      run: npm ci

    - name: 🧹 Lint (Calidad de código)
      run: npm run lint

    - name: 🧪 Tests Unitarios
      run: npm run test

    - name: 🤖 Tests E2E
      run: npm run test:e2e
      env:
        # Variables de entorno simuladas para los tests
        MONGO_URI: mongodb://localhost:27017/delivery-test
        JWT_SECRET: super-secret-test-key
        PORT: 3000
        NODE_ENV: test
        AWS_S3_REGION: us-east-1
        AWS_ACCESS_KEY_ID: dummy-key
        AWS_SECRET_ACCESS_KEY: dummy-secret
        AWS_S3_BUCKET: dummy-bucket

  frontend-ci:
    name: Frontend - Lint, Test & Build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./delivery-frontend

    steps:
    - name: 📥 Clonar repositorio
      uses: actions/checkout@v4

    - name: ⚙️ Configurar Node.js 20
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: ./delivery-frontend/package-lock.json

    - name: 📦 Instalar dependencias Frontend
      run: npm ci

    - name: 🧹 Lint (ESLint)
      run: npm run lint

    - name: 🔷 Typecheck (TypeScript)
      run: npm run typecheck

    - name: 🧪 Tests Unitarios (Vitest)
      run: npm run test

    - name: 🏗️ Build Producción (Vite + PWA)
      run: npm run build
      env:
        VITE_API_URL: https://api.delivery.com/api/v1
        VITE_WS_URL: https://api.delivery.com

    - name: 🎭 Instalar Playwright Chromium
      run: npx playwright install --with-deps chromium

    - name: 🤖 Tests E2E Frontend (Playwright)
      run: npm run test:e2e
