server {
  listen 8080;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Compresión Gzip para bundles JS, CSS, JSON y SVG
  gzip on;
  gzip_vary on;
  gzip_proxied any;
  gzip_comp_level 6;
  gzip_min_length 1024;
  gzip_types
    text/plain
    text/css
    text/javascript
    application/javascript
    application/json
    application/manifest+json
    application/xml
    image/svg+xml;

  # Cabeceras de seguridad básicas
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;

  # Healthcheck interno para Docker / Orchestrators
  location = /healthz {
    access_log off;
    add_header Content-Type text/plain;
    return 200 "ok\n";
  }

  # Assets con hash de contenido generado por Vite (cache inmutable de 1 año)
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    try_files $uri =404;
  }

  # No cachear entrypoints críticos ni el Service Worker
  location ~* ^/(index\.html|sw\.js|manifest\.webmanifest)$ {
    add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate" always;
    expires -1;
    try_files $uri =404;
  }

  # Soporte para SPA (React Router History API fallback)
  location / {
    try_files $uri $uri/ /index.html;
  }
}
