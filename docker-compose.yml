services:
  api:
    build:
      context: ./delivery-backend
      target: builder    # 💡 Usa la etapa de build, no la de producción (así tenemos el CLI)
    ports:
      - '3000:3000'
    env_file: ./delivery-backend/.env
    depends_on:
      mongo:
        condition: service_healthy
    volumes:
      - ./delivery-backend/src:/app/src    # 💡 Hot reload: los cambios en local se reflejan en Docker
    command: npm run start:dev
    restart: unless-stopped

  mongo:
    image: mongo:7
    ports:
      - '27017:27017'
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: admin123
      MONGO_INITDB_DATABASE: delivery
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh --quiet
      interval: 10s
      timeout: 5s
      retries: 5

  # Base de datos en memoria para caché y colas en un futuro
  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'
    command: redis-server --maxmemory 128mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  # Interfaz gráfica para ver tu base de datos Mongo (opcional pero muy útil)
  mongo-express:
    image: mongo-express
    ports:
      - '8081:8081'
    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: admin
      ME_CONFIG_MONGODB_ADMINPASSWORD: admin123
      ME_CONFIG_MONGODB_URL: mongodb://admin:admin123@mongo:27017/
    depends_on:
      mongo:
        condition: service_healthy

volumes:
  mongo-data:
