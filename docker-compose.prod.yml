services:
  api:
    build:
      context: ./delivery-backend
      target: production # 💡 Aquí sí usamos la etapa ligera y segura final
    ports:
      - '3000:3000'
    env_file: ./delivery-backend/.env.production
    depends_on:
      - mongo
      - redis
    restart: always
    deploy:
      replicas: 2 # Corre 2 instancias de la API para soportar más carga
      resources:
        limits:
          cpus: '0.5'
          memory: 512M

  mongo:
    image: mongo:7
    volumes:
      - mongo-data:/data/db
    restart: always

  redis:
    image: redis:7-alpine
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru --appendonly yes
    volumes:
      - redis-data:/data
    restart: always

  frontend:
    build:
      context: ./delivery-frontend
      target: production
      args:
        VITE_API_URL: ${VITE_API_URL:-https://api.delivery.com/api/v1}
        VITE_WS_URL: ${VITE_WS_URL:-https://api.delivery.com}
    ports:
      - '8080:8080'
    depends_on:
      - api
    restart: always
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 128M

volumes:
  mongo-data:
  redis-data:
